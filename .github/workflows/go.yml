name: Go

on:
  pull_request:
    branches: [ "main" ]

jobs:

  test:
    runs-on: tks-gha-runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install report tool
        run: go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -vet=off 2>&1 $(go list ./... | grep -Ev '^github\.com/cloud104/etcd-operator/test') | go-junit-report -set-exit-code > report.xml

      - name: Summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: report.xml
        if: always()
